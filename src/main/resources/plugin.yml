name: Hevenly
version: 1.0
main: fr.hevenly.HevenlyPlugin
depend: [WorldGuard]

commands:
  setspawn:
    description: Definit le spawn du serveur
    usage: /setspawn
    permission: hevenly.setspawn

  spawn:
    description: Se teleporter au spawn
    usage: /spawn

permissions:
  hevenly.setspawn:
    description: Permet de definir le spawn
    default: op
