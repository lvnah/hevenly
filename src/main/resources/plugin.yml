name: Hevenly
version: 1.1
main: fr.hevenly.HevenlyPlugin
depend: [WorldGuard]

commands:
  setspawn:
    description: Definit le spawn du lobby
    usage: /setspawn
    permission: hevenly.setspawn
  spawn:
    description: Se teleporter au spawn du lobby
    usage: /spawn
  setrank:
    description: Attribuer un grade a un joueur
    usage: /setrank <joueur> <default|plus|premium|helper|mod|owner>
    permission: hevenly.setrank
  bf:
    description: Gestion du BedFight (arenes, spawns, lits, partie)
    usage: /bf arenes | tp <nom> | spawn <rouge|bleu> <nom> | lit <rouge|bleu> <nom> | renommer <nom> <nouveau> | supprimer <nom> | start | leave
  elo:
    description: Affiche ton elo classe ou celui d'un joueur
    usage: /elo [pseudo]
  leaderboard:
    description: Top 10 du classement ranked
    usage: /leaderboard
  build:
    description: Active ou desactive le mode construction hors match (op)
    usage: /build
  season:
    description: Recompenses de fin de saison pour le top 3 ranked (op)
    usage: /season reward
  lbholo:
    description: Place l'hologramme du top 10 ranked a ta position, ou supprime tous les hologrammes (op)
    usage: /lbholo [clear]
  bfleave:
    description: Quitter la file d'attente BedFight
    usage: /bfleave
  invite:
    description: Inviter un joueur en 2v2 BedFight, ou accepter une invitation
    usage: /invite <pseudo|accept>
  help:
    description: Afficher la liste des commandes
    usage: /help
  clearchat:
    description: Vider le chat (owner, mod, helper)
    usage: /clearchat
    aliases: [cc]
  gm:
    description: Change ton mode de jeu (0 survie, 1 creatif pour les op)
    usage: /gm <0|1>
  mod:
    description: Outils mod et owner
    usage: /mod

permissions:
  hevenly.setspawn:
    description: Permet de definir le spawn du lobby
    default: op
  hevenly.setrank:
    description: Permet de modifier les grades
    default: op
  hevenly.bedfight.admin:
    description: Permet de configurer et administrer BedFight
    default: op
