name: Hevenly
version: 1.0
main: fr.hevenly.HevenlyPlugin
depend: [WorldGuard]

commands:
  setspawn:
    description: Definit le spawn du serveur
    usage: /setspawn
    permission: hevenly.setspawn

  spawn:
    description: Se teleporter au spawn
    usage: /spawn

  setrank:
    description: Attribuer un grade a un joueur
    usage: /setrank <joueur> <default|vip|helper|elite|mod|owner>
    permission: hevenly.setrank

permissions:
  hevenly.setspawn:
    description: Permet de definir le spawn
    default: op

  hevenly.setrank:
    description: Permet de modifier les grades
    default: op